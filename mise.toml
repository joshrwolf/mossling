min_version = "2026.9.11"

[tools]
tuist = { version = "4.208.0", os = ["macos"] }

[tasks.generate]
description = "Generate the Xcode workspace from the typed Tuist project graph"
run = "tuist generate --no-open"

[tasks.build]
description = "Compile the iPhone and Watch simulator applications"
depends = ["generate"]
run = [
  "xcodebuild -project Mossling.xcodeproj -scheme Mossling -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath .build-artifacts/SimulatorDerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary build",
  "xcodebuild -project Mossling.xcodeproj -scheme MosslingWatch -configuration Debug -destination 'generic/platform=watchOS Simulator' -derivedDataPath .build-artifacts/SimulatorDerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary build",
]

[tasks."test:core"]
description = "Run the portable Swift domain tests (Linux or macOS)"
run = "swift test --package-path Packages/MosslingCore --parallel"

[tasks."tools:ui"]
description = "Compile the simulator helper before any device boots"
sources = ["Tools/RunUITests.swift", "mise.toml"]
outputs = [".build-artifacts/tools/ui-tests"]
run = [
  "mkdir -p .build-artifacts/tools",
  "swiftc -swift-version 6 -warnings-as-errors Tools/RunUITests.swift -o .build-artifacts/tools/ui-tests",
]

[tasks."test:ui"]
# Both tasks share Xcode's build database; serialize when selected together.
wait_for = ["build"]
description = "Exercise real iPhone forms in a disposable simulator and save screenshots"
depends = ["generate", "tools:ui"]
run = [".build-artifacts/tools/ui-tests", "mise run test:ui:verify"]

# CI calls the same runner in explicit phases so simulator startup cannot consume
# the test execution budget. Local test:ui retains the complete ordered flow.
[tasks."test:ui:build"]
wait_for = ["build"]
depends = ["generate", "tools:ui"]
run = ".build-artifacts/tools/ui-tests build"

[tasks."test:ui:prepare"]
depends = ["tools:ui"]
run = ".build-artifacts/tools/ui-tests prepare"

[tasks."test:ui:run"]
depends = ["tools:ui"]
run = [".build-artifacts/tools/ui-tests test", "mise run test:ui:verify"]

[tasks."test:ui:cleanup"]
depends = ["tools:ui"]
run = ".build-artifacts/tools/ui-tests cleanup"

[tasks."test:ui:focus"]
description = "Rebuild and run one UI method, retaining the owned simulator for fast iteration"
depends = ["generate", "tools:ui"]
wait_for = ["build", "test:ui", "test:ui:build", "test:ui:run"]
usage = 'arg "<test>" help="MosslingUITests/Suite/testMethod (one method, no parentheses)"'
run = '.build-artifacts/tools/ui-tests focus "${usage_test?}"'

[tasks."test:ui:verify"]
description = "Reject empty, skipped or incomplete native test-plan results"
run = [
  "xcrun xcresulttool get test-results summary --path .build-artifacts/UI-Tests.xcresult > .build-artifacts/UI-Summary.json",
  'python3 Tools/Tests/test_ui_plans.py --result-summary .build-artifacts/UI-Summary.json --plan "${MOSSLING_UI_TEST_PLAN:-All}"',
]

[tasks."diagnose:host"]
description = "Record macOS runner memory, swap and CPU consumers without process arguments"
run = [
  "date -u",
  "sysctl hw.memsize hw.ncpu vm.swapusage",
  "vm_stat",
  "ps -axo pid,pcpu,rss,comm -r",
]

[tasks."diagnose:ui"]
description = "Save Debug app lifecycle intervals from the owned simulator before cleanup"
depends = ["tools:ui"]
run = ".build-artifacts/tools/ui-tests diagnose > .build-artifacts/ui-lifecycle.log"

[tasks."archive:check"]
description = "Build an unsigned Release archive and validate the phone/Watch bundle contract"
depends = ["generate"]
run = [
  "xcodebuild -project Mossling.xcodeproj -scheme Mossling -configuration Release -destination 'generic/platform=iOS' -archivePath .build-artifacts/Mossling.xcarchive -derivedDataPath .build-artifacts/ReleaseDerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary archive",
  "swift Tools/CheckArchive.swift .build-artifacts/Mossling.xcarchive",
]

[tasks."project:check"]
description = "Reject missing or stale committed Tuist-generated Cloud project snapshots"
depends = ["generate"]
run = [
  "git ls-files --error-unmatch Mossling.xcodeproj/project.pbxproj Mossling.xcworkspace/contents.xcworkspacedata",
  "git diff --exit-code -- Mossling.xcodeproj Mossling.xcworkspace",
  "git ls-files --others --exclude-standard -- Mossling.xcodeproj Mossling.xcworkspace",
  'test -z "$(git ls-files --others --exclude-standard -- Mossling.xcodeproj Mossling.xcworkspace)"',
]

[tasks."test:tooling"]
description = "Exercise Cloud environment boundaries and malformed release archives"
run = ["swift Tools/Tests/RunCloudHookTests.swift", "swift Tools/Tests/RunUITestRunnerTests.swift", "python3 Tools/Tests/test_archive.py", "python3 Tools/Tests/test_ui_plans.py"]

[tasks."cloud:prepare"]
description = "Prepare Cloud native actions with domain tests and canonical project validation"
depends = ["test:core", "project:check"]

[tasks.verify]
description = "Run all development gates, including UI tests and Release packaging"
depends = ["test:core", "test:tooling", "project:check", "build", "test:ui", "archive:check"]
