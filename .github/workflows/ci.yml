name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Swift domain tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the tool downloader in the minimal Swift container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
      - run: mise run test:core
      - name: Test release tooling
        run: |
          apt-get install -y --no-install-recommends python3
          mise run test:tooling
  apple:
    name: Apple builds, UI tests and Release archive
    # Keep the proven Apple gate until Cloud verification is accepted.
    if: vars.MOSSLING_XCODE_CLOUD_ACTIVE != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
      - name: Generate the canonical Cloud project snapshot
        run: mise run generate
      - name: Preserve the generated snapshot for review and bootstrap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-project
          path: |
            Mossling.xcodeproj
            Mossling.xcworkspace
          retention-days: 7
      - name: Reject generated project drift
        run: mise run project:check
      - name: Exercise the real Cloud preparation adapter with fixture identity
        env:
          CI: "TRUE"
          CI_XCODE_CLOUD: "TRUE"
          CI_BUNDLE_ID: com.joshrwolf.mossling
          CI_TEAM_ID: ABCDE12345
          CI_BUILD_NUMBER: "42"
        run: CI_PRIMARY_REPOSITORY_PATH="$GITHUB_WORKSPACE" ./ci_scripts/ci_post_clone.sh
      - name: Verify the project lifecycle
        run: mise run --jobs 1 verify
      - name: Exercise the detached Cloud archive adapter against the real archive
        env:
          CI: "TRUE"
          CI_XCODE_CLOUD: "TRUE"
          CI_BUNDLE_ID: com.joshrwolf.mossling
          CI_TEAM_ID: ABCDE12345
          CI_BUILD_NUMBER: "42"
          CI_XCODEBUILD_ACTION: archive
          CI_XCODEBUILD_EXIT_CODE: "0"
        run: |
          phase_dir=$(mktemp -d)
          trap 'rm -rf "$phase_dir"' EXIT
          cp -RL ci_scripts "$phase_dir/ci_scripts"
          CI_ARCHIVE_PATH="$GITHUB_WORKSPACE/.build-artifacts/Mossling.xcarchive" "$phase_dir/ci_scripts/ci_post_xcodebuild.sh"
      - name: Preserve UI screenshots and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-test-results
          path: |
            .build-artifacts/screenshots
            .build-artifacts/UI-Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
