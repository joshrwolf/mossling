name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Swift domain tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the tool downloader in the minimal Swift container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
      - run: mise run test:core
      - name: Test release tooling
        run: |
          apt-get install -y --no-install-recommends python3
          mise run test:tooling
  apple:
    name: Apple builds, UI tests and Release archive
    # Public-repository PR verification remains on GitHub; Cloud owns signing/delivery.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
      - name: Exercise the real Cloud preparation adapter with fixture identity
        timeout-minutes: 5
        env:
          CI: "TRUE"
          CI_XCODE_CLOUD: "TRUE"
          CI_BUNDLE_ID: com.joshrwolf.mossling
          CI_TEAM_ID: ABCDE12345
          CI_BUILD_NUMBER: "42"
        run: CI_PRIMARY_REPOSITORY_PATH="$GITHUB_WORKSPACE" ./ci_scripts/ci_post_clone.sh
      - name: Preserve the generated snapshot for review and bootstrap
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-project
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            Mossling.xcodeproj
            Mossling.xcworkspace
          retention-days: 7
      # The real post-clone adapter above already ran domain tests, generation
      # and drift validation. Reuse that prepared checkout; do not regenerate it
      # for every phase. Keep each expensive phase visible and bounded.
      - name: Test release tooling
        timeout-minutes: 3
        run: mise run test:tooling
      - name: Build both simulator schemes
        timeout-minutes: 6
        run: mise run --skip-deps build
      - name: Build and validate the Release archive
        timeout-minutes: 6
        run: mise run --skip-deps archive:check
      - name: Confirm the generated project stayed clean
        run: mise run --skip-deps project:check
      - name: Exercise the detached Cloud archive adapter against the real archive
        env:
          CI: "TRUE"
          CI_XCODE_CLOUD: "TRUE"
          CI_BUNDLE_ID: com.joshrwolf.mossling
          CI_TEAM_ID: ABCDE12345
          CI_BUILD_NUMBER: "42"
          CI_XCODEBUILD_ACTION: archive
          CI_XCODEBUILD_EXIT_CODE: "0"
        run: |
          phase_dir=$(mktemp -d)
          trap 'rm -rf "$phase_dir"' EXIT
          cp -RL ci_scripts "$phase_dir/ci_scripts"
          CI_ARCHIVE_PATH="$GITHUB_WORKSPACE/.build-artifacts/Mossling.xcarchive" "$phase_dir/ci_scripts/ci_post_xcodebuild.sh"
      - name: Build UI test products before booting the simulator
        id: ui_build
        timeout-minutes: 6
        run: mise run --skip-deps test:ui:build
      - name: Record host resources before simulator boot
        run: mise run diagnose:host | tee .build-artifacts/ui-host-before.txt
      - name: Boot one disposable iPhone simulator
        id: ui_prepare
        timeout-minutes: 6
        run: mise run test:ui:prepare
      - name: Record host resources after simulator boot
        if: always() && steps.ui_build.outcome == 'success'
        run: mise run diagnose:host | tee .build-artifacts/ui-host-after-boot.txt
      - name: Run all seven iPhone UI flows without rebuilding
        timeout-minutes: 15
        run: mise run test:ui:run
      - name: Record host resources after UI execution
        if: always() && steps.ui_build.outcome == 'success'
        run: mise run diagnose:host | tee .build-artifacts/ui-host-after-tests.txt
      - name: Remove the disposable UI simulator
        if: always() && (steps.ui_prepare.outcome == 'success' || steps.ui_prepare.outcome == 'failure' || steps.ui_prepare.outcome == 'cancelled')
        timeout-minutes: 2
        run: mise run test:ui:cleanup
      - name: Preserve UI screenshots and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-test-results
          include-hidden-files: true
          path: |
            .build-artifacts/screenshots
            .build-artifacts/UI-Tests.xcresult
            .build-artifacts/ui-host-*.txt
            .build-artifacts/UI-Timings.*
          if-no-files-found: ignore
          retention-days: 7
